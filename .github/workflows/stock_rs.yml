name: Nifty Sector Relative Strength

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-rs:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty Sector RS
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python src/main.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh data/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_rs.csv data/stock_rs.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Nifty sector relative strength data"
            git push
          fi